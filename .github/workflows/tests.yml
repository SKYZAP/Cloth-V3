# Typecheck and run the test suite on every push to master and every pull request, on GitHub's own runners.
name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npx vitest run --testTimeout=60000 --reporter=default --reporter=json --outputFile.json=test-results.json
      - name: Summary
        if: always()
        run: |
          node -e '
            const fs = require("fs")
            if (!fs.existsSync("test-results.json")) process.exit(0)
            const r = JSON.parse(fs.readFileSync("test-results.json", "utf8"))
            const failed = r.testResults.flatMap((f) => f.assertionResults.filter((a) => a.status === "failed").map((a) => `- ${f.name.replace(process.cwd() + "/", "")} › ${a.fullName}`))
            const lines = [`## Tests: ${r.numPassedTests} passed, ${r.numFailedTests} failed, ${r.numPendingTests + r.numTodoTests} skipped`, "", ...failed]
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n")
          '
