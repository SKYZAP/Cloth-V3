# Build Cloth for Windows (x64), macOS (Apple silicon only) and Android, and attach the installers to a GitHub release.
#
# Runs when a release is published, or manually (Actions → Release → Run workflow) with a
# version number: the manual run creates the release (tag v<version>) if it doesn't exist yet,
# otherwise it re-uploads the installers to it.
#
# Signing is optional. Without secrets the builds are unsigned (Windows SmartScreen and macOS
# Gatekeeper will warn). To sign, add repository secrets:
#   macOS:   CSC_LINK (base64 .p12), CSC_KEY_PASSWORD, and for notarization
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
#   Android: ANDROID_KEYSTORE (base64 .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (default "cloth"),
#            ANDROID_KEY_PASSWORD (defaults to the keystore password). Without these the APK is signed
#            with a throwaway debug key, so it installs but can't update over an APK from another run.
#            Make a keystore once with:
#              keytool -genkeypair -v -keystore cloth.jks -alias cloth -keyalg RSA -keysize 4096 -validity 36500
#            then store `base64 -w0 cloth.jks` as ANDROID_KEYSTORE.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.2.0 (the tag will be v1.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as a pre-release (only when this run creates the release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve version and tag
        id: meta
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          raw="${EVENT_TAG:-$INPUT_VERSION}"
          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' is not a semantic version like 1.2.0 or v1.2.0-beta.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${EVENT_TAG:-v$version}" >> "$GITHUB_OUTPUT"

      - name: Create the release (manual runs)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — installers will be (re)uploaded to it."
          else
            flags=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Cloth $TAG" --generate-notes)
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: --win
          # macOS: Apple silicon only (Intel Macs are not supported).
          - name: macOS Apple silicon
            os: macos-15
            platform: --mac --arm64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tagged commit, not whatever the default branch points at now.
          ref: ${{ github.event_name == 'release' && needs.prepare.outputs.tag || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set app version
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Obscura, CPython + SearXNG are downloaded (pinned + checksummed) per platform/arch.
      - name: Cache sidecars
        uses: actions/cache@v4
        with:
          path: sidecars
          key: sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/stage-*.mjs', 'scripts/sidecar-utils.mjs', 'resources/searxng/**') }}

      - name: Stage sidecars
        run: npm run sidecars

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The Flow Runner template and NSIS ship inside the Windows installer, for exporting flows as apps.
      - name: Build flow runner
        if: runner.os == 'Windows'
        run: npm run build:runner

      - name: Build app
        run: npx electron-vite build

      - name: Package installer
        shell: bash
        env:
          # Sign only when certificates are configured; otherwise produce unsigned builds.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # electron-builder treats empty signing vars as "configured"; drop them instead.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            [ -z "${!v}" ] && unset "$v"
          done
          npx electron-builder ${{ matrix.platform }} --publish never

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers found in release/"
            ls -la release
            exit 1
          fi
          printf 'Uploading %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep installers as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloth-${{ env.VERSION }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build (Android)
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && needs.prepare.outputs.tag || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The runner image ships the Android SDK (ANDROID_HOME); add what Capacitor 8 builds against.
      # (android-actions/setup-android is avoided: it installs the retired "tools" package and fails.)
      - name: Android SDK
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Set app version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/cloth.jks"
            echo "CLOTH_KEYSTORE=$RUNNER_TEMP/cloth.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE is not set — the APK is signed with a throwaway debug key."
          fi

      - name: Build APK
        env:
          CLOTH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLOTH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLOTH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/mobile-apk.mjs release "$VERSION"
          mkdir -p release
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "release/Cloth-$VERSION-android.apk"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "release/Cloth-$VERSION-android.apk" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloth-${{ env.VERSION }}-android
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14
