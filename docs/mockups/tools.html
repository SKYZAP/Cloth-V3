<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloth tools</title>
<style>
  :root {
    --bg: #0a0a0b; --panel: #111113; --elev: #18181b; --elev2: #202024; --line: #26262b; --line-strong: #34343b;
    --fg: #ececef; --muted: #a3a3ad; --dim: #85858f;
    --crimson: #dc2645; --crimson-hi: #ef3d5c; --crimson-soft: rgb(220 38 69 / 0.12); --crimson-line: rgb(220 38 69 / 0.35);
    --ok: #3fb97a; --warn: #e0a43a; --info: #6b9cf0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Inter, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  :focus-visible { outline: 2px solid var(--crimson-hi); outline-offset: 2px; }
  kbd { font-family: inherit; font-size: 10.5px; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; color: var(--muted); }

  .top { height: 34px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-weight: 600; }
  .logo { width: 18px; height: 18px; border-radius: 5px; background: var(--crimson); display: grid; place-items: center; font-size: 11px; color: #fff; }
  .app { display: grid; grid-template-columns: 56px minmax(0, 1fr); height: calc(100vh - 34px); }
  .rail { border-right: 1px solid var(--line); display: grid; align-content: start; justify-items: center; gap: 6px; padding-top: 12px; }
  .rail span { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--dim); }
  .rail span.on { background: var(--crimson-soft); color: var(--crimson-hi); }
  .rail svg { width: 18px; height: 18px; }

  .page { position: relative; overflow-y: auto; }
  .wrap { padding: 28px 32px 60px; }
  .head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .head p { margin: 2px 0 0; color: var(--muted); }
  .head .grow { flex: 1; min-width: 240px; }
  .search { display: flex; align-items: center; gap: 8px; width: 300px; height: 34px; border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; background: var(--panel); }
  .search:focus-within { border-color: var(--crimson-line); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; }
  .search input::placeholder { color: var(--dim); }
  .new { height: 34px; border-radius: 9px; background: var(--crimson); color: #fff; font-weight: 600; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; }
  .new:hover { background: var(--crimson-hi); }

  .bar { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 4px; margin-top: 18px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .tab { height: 30px; border-radius: 8px; padding: 0 11px; color: var(--muted); }
  .tab small { color: var(--dim); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .tab.on { background: var(--elev2); color: var(--fg); font-weight: 600; }
  .tab:hover:not(.on) { color: var(--fg); }
  .bar .spacer { flex: 1; }
  .jump { display: flex; gap: 2px; }
  .jump button { height: 26px; padding: 0 8px; border-radius: 7px; color: var(--dim); font-size: 12px; }
  .jump button:hover { color: var(--fg); background: var(--elev); }

  section { margin-top: 26px; }
  section h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  section h2 small { color: var(--dim); font-weight: 400; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .tool { text-align: left; display: grid; grid-template-rows: 1fr auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); transition: border-color .15s, background .15s; min-height: 124px; }
  .tool:hover { border-color: var(--line-strong); background: var(--elev); }
  .tool.sel { border-color: var(--crimson-line); box-shadow: 0 0 0 1px var(--crimson-line); }
  .tool .body { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 14px 14px 10px; }
  .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--elev2); display: grid; place-items: center; color: var(--muted); }
  .ic svg { width: 15px; height: 15px; }
  .tool b { font-weight: 600; font-size: 13.5px; }
  .tool .id { color: var(--dim); font-size: 11.5px; margin-left: 6px; }
  .tool p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tool .foot { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 8px 14px; color: var(--dim); font-size: 11.5px; }
  .tool .foot .uses { margin-left: auto; font-variant-numeric: tabular-nums; }
  .spark { display: inline-flex; align-items: flex-end; gap: 1px; height: 12px; }
  .spark i { width: 2px; background: var(--line-strong); border-radius: 1px; }
  .tool:hover .spark i, .tool.sel .spark i { background: var(--dim); }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }

  /* Details drawer */
  .scrim { position: fixed; inset: 34px 0 0 56px; background: rgb(0 0 0 / .45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 34px; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--panel); border-left: 1px solid var(--line-strong); transform: translateX(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); z-index: 11; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
  .drawer.open { transform: none; box-shadow: -24px 0 48px rgb(0 0 0 / .4); }
  @media (prefers-reduced-motion: reduce) { .drawer, .scrim { transition: none; } }
  .dh { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 16px 16px 14px 20px; border-bottom: 1px solid var(--line); }
  .dh .ic { width: 38px; height: 38px; border-radius: 10px; }
  .dh .ic svg { width: 18px; height: 18px; }
  .dh h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .dh .id { color: var(--dim); font-size: 12px; }
  .dnav { display: flex; gap: 2px; }
  .dnav button { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--dim); }
  .dnav button:hover { color: var(--fg); background: var(--elev2); }
  .dnav svg { width: 15px; height: 15px; }
  .db { overflow-y: auto; padding: 18px 20px 24px; }
  .db > p { margin: 0 0 16px; color: var(--fg); line-height: 1.6; }
  .db h4 { margin: 22px 0 8px; font-size: 12.5px; font-weight: 600; color: var(--fg); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; }
  .stats div { padding: 10px 12px; }
  .stats div + div { border-left: 1px solid var(--line); }
  .stats b { display: block; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--dim); font-size: 11.5px; }
  .usage { display: flex; align-items: flex-end; gap: 2px; height: 36px; margin-top: 10px; }
  .usage i { flex: 1; background: var(--crimson-line); border-radius: 2px 2px 0 0; min-height: 2px; }
  .usage-cap { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; margin-top: 4px; }
  .inputs { border: 1px solid var(--line); border-radius: 10px; }
  .inp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 12px; }
  .inp + .inp { border-top: 1px solid var(--line); }
  .inp code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .inp .t { color: var(--dim); font-size: 11.5px; text-align: right; }
  .inp .req { color: var(--crimson-hi); }
  .inp p { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .note { color: var(--dim); font-size: 12px; margin: 8px 0 0; }
  details { margin-top: 22px; border: 1px solid var(--line); border-radius: 10px; }
  summary { cursor: pointer; padding: 9px 12px; font-size: 12.5px; color: var(--muted); list-style: none; display: flex; gap: 6px; align-items: center; }
  summary::before { content: '›'; transition: transform .15s; display: inline-block; }
  details[open] summary::before { transform: rotate(90deg); }
  pre { margin: 0; padding: 10px 12px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); overflow-x: auto; }

  .try { border: 1px solid var(--crimson-line); border-radius: 12px; background: linear-gradient(var(--crimson-soft), transparent 70%); padding: 12px; }
  .try label { display: grid; gap: 4px; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
  .try input { height: 32px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); padding: 0 10px; outline: 0; }
  .try input:focus { border-color: var(--crimson-line); }
  .try .row { display: flex; gap: 8px; align-items: center; }
  .run { height: 32px; border-radius: 8px; background: var(--crimson); color: #fff; font-weight: 600; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; }
  .run:hover { background: var(--crimson-hi); }
  .try .hint { color: var(--dim); font-size: 11.5px; }
  .out { margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 11.5px; padding: 8px 10px; color: var(--muted); max-height: 140px; overflow: auto; display: none; white-space: pre; }
  .out.show { display: block; }
  .df { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .df .on { color: var(--ok); display: inline-flex; gap: 6px; align-items: center; }
  .df .on::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

  @media (max-width: 720px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .rail { display: none; }
    .wrap { padding: 20px 16px 48px; }
    .search { width: 100%; }
    .jump { display: none; }
    .scrim { inset: 34px 0 0 0; }
    .drawer { top: auto; height: 86vh; width: 100%; border-left: 0; border-top: 1px solid var(--line-strong); border-radius: 16px 16px 0 0; transform: translateY(100%); }
  }
</style>
</head>
<body>
<div class="top"><span class="logo">C</span> Cloth</div>
<div class="app">
  <nav class="rail" aria-label="App">
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg></span>
    <span class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20V3H6.5A2.5 2.5 0 004 5.5z"/></svg></span>
  </nav>

  <main class="page" id="page">
    <div class="wrap">
      <div class="head">
        <div class="grow">
          <h1>Tools</h1>
          <p>What Cloth and your agents can do. Try any of your tools, or make your own.</p>
        </div>
        <label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Search tools" aria-label="Search tools" /><kbd>/</kbd></label>
        <button class="new"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>New tool</button>
      </div>

      <div class="bar">
        <div id="tabs" role="tablist" aria-label="Show" style="display:flex;gap:4px"></div>
        <span class="spacer"></span>
        <div class="jump" id="jump" aria-label="Jump to group"></div>
      </div>

      <div id="groups"></div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true">
  <div class="dh">
    <span class="ic" id="dIcon"></span>
    <div style="min-width:0"><h3 id="dTitle"></h3><span class="id mono" id="dId"></span></div>
    <div class="dnav">
      <button id="prev" aria-label="Previous tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 15l-6-6-6 6"/></svg></button>
      <button id="next" aria-label="Next tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></button>
      <button id="close" aria-label="Close details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
  <div class="db" id="dBody"></div>
  <div class="df"><span id="dSource"></span><span class="on">Available to agents</span></div>
</aside>

<script>
  const ICON = {
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',
    globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20V3H6.5A2.5 2.5 0 004 5.5z"/></svg>',
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
    spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>',
    wrench: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>',
    plug: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 01-12 0zM12 18v4"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>'
  }
  // [group, label, id, description, uses30d, source, inputs [name,type,required,desc]]
  const G = [['workspace', 'Files and code', 'file'], ['web', 'Web', 'globe'], ['knowledge', 'Knowledge', 'book'], ['planning', 'Planning', 'list'], ['skills', 'Skills', 'spark'], ['tools', 'Making tools', 'wrench'], ['mine', 'Made by you', 'link'], ['mcp', 'From MCP · github', 'plug']]
  const T = [
    ['workspace', 'Search files', 'grep', 'Regex search (case-insensitive) across text files in the workspace, or in one file when path is a file. Returns path:line: text.', 86, 'builtin', [['pattern', 'Text', 1, 'The regular expression to look for.'], ['path', 'Text', 0, 'A folder or file to search; the whole workspace by default.'], ['maxResults', 'Number', 0, 'Stop after this many matches.']]],
    ['workspace', 'Read file', 'read', 'Read a text or image file from the workspace, with offset/limit for large files.', 258, 'builtin', [['path', 'Text', 1, 'File to read.'], ['offset', 'Number', 0, 'First line to read.'], ['limit', 'Number', 0, 'How many lines.']]],
    ['workspace', 'List directory', 'ls', 'List a directory in the workspace.', 43, 'builtin', [['path', 'Text', 0, 'Folder to list.'], ['limit', 'Number', 0, 'Most entries to show.']]],
    ['workspace', 'Find files', 'find', 'Find files by glob pattern (e.g. **/*.ts) in the workspace.', 39, 'builtin', [['pattern', 'Text', 1, 'A glob such as **/*.ts.'], ['path', 'Text', 0, 'Where to start.']]],
    ['workspace', 'AST search', 'ast_grep', 'Structural code search with ast-grep patterns ($VAR, $$ARGS). TS/JS/TSX/HTML/CSS, Python, Go, Rust, Java.', 0, 'builtin', [['pattern', 'Text', 1, 'An ast-grep pattern.'], ['lang', 'Text', 0, 'Language; guessed from files.']]],
    ['workspace', 'AST rewrite', 'ast_edit', 'Rewrite every match of an ast-grep pattern, reusing captured $VARS. One approval (combined diff) for all files; undoable.', 0, 'builtin', [['pattern', 'Text', 1, 'What to match.'], ['rewrite', 'Text', 1, 'What to replace it with.']]],
    ['workspace', 'Code intelligence', 'lsp', 'Language-server diagnostics, definition, references, hover, symbols and rename for TypeScript/JavaScript and Python.', 5, 'builtin', [['action', 'Text', 1, 'diagnostics, definition, references, hover, symbols or rename.'], ['path', 'Text', 1, 'File to ask about.']]],
    ['workspace', 'Write file', 'write', 'Create or overwrite a file. Asks for approval (with a diff) unless edits are auto-approved; undoable.', 13, 'builtin', [['path', 'Text', 1, 'File to write.'], ['content', 'Text', 1, 'The whole new file.']]],
    ['workspace', 'Edit file', 'edit', 'Replace exact text in a file (one or more edits). Asks for approval (with a diff) unless edits are auto-approved; undoable.', 53, 'builtin', [['path', 'Text', 1, 'File to change.'], ['edits', 'List or object', 1, 'Pairs of old and new text.']]],
    ['workspace', 'Run command', 'powershell', 'Run a PowerShell command in the workspace. Risky commands ask first.', 35, 'builtin', [['command', 'Text', 1, 'The command to run.'], ['timeout', 'Number', 0, 'Seconds before it is stopped.']]],
    ['web', 'Web search', 'web_search', 'Search the public web. Returns titles, URLs and snippets.', 31, 'builtin', [['query', 'Text', 1, 'What to search for.']]],
    ['web', 'Fetch web page', 'web_fetch', 'Fetch a web page and return its main content as text.', 27, 'builtin', [['url', 'Text', 1, 'The page address.']]],
    ['knowledge', 'Knowledge search', 'rag_search', 'Search your knowledge collections for passages that answer a question.', 12, 'builtin', [['query', 'Text', 1, 'The question.'], ['collection', 'Text', 0, 'Limit to one collection.']]],
    ['knowledge', 'Index knowledge', 'rag_index', 'Add files or pages to a knowledge collection.', 2, 'builtin', [['collection', 'Text', 1, 'Where to add them.'], ['paths', 'List or object', 1, 'Files or URLs.']]],
    ['planning', 'Todo list', 'todo_write', 'Keep a short list of steps for the current job and mark them as they get done.', 64, 'builtin', [['todos', 'List or object', 1, 'The full list with each step’s status.']]],
    ['planning', 'Present plan', 'present_plan', 'In Plan mode, show the plan for you to approve before anything changes.', 4, 'builtin', [['title', 'Text', 1, 'A short name.'], ['steps', 'List or object', 1, 'The steps.']]],
    ['planning', 'Ask the user', 'ask_user', 'Ask you a question with choices and wait for the answer.', 9, 'builtin', [['question', 'Text', 1, 'What to ask.'], ['options', 'List or object', 0, 'Choices to offer.']]],
    ['planning', 'Subagent', 'task', 'Hand a self-contained job to a subagent with its own fresh context. Several can run in parallel.', 18, 'builtin', [['prompt', 'Text', 1, 'The brief.'], ['tier', 'Text', 0, 'low, careful or high.']]],
    ['skills', 'List skills', 'skill_list', 'List the skills available in this chat.', 7, 'builtin', []],
    ['skills', 'Load skill', 'skill_use', 'Load a skill’s instructions into the conversation.', 21, 'builtin', [['name', 'Text', 1, 'Skill to load.']]],
    ['skills', 'Create skill', 'skill_create', 'Save a new skill from instructions you give it.', 1, 'builtin', [['name', 'Text', 1, 'Skill name.'], ['body', 'Text', 1, 'The instructions.']]],
    ['tools', 'Create tool', 'tool_create', 'Make a new tool (web request, script, command or prompt) for later chats.', 0, 'builtin', [['name', 'Text', 1, 'Tool name.'], ['kind', 'Text', 1, 'How it works.']]],
    ['mine', 'Exchange rate', 'exchange_rate', 'Calls the Frankfurter API and returns today’s rate between two currencies.', 6, 'mine', [['from', 'Text', 1, 'Currency code, e.g. USD.'], ['to', 'Text', 1, 'Currency code, e.g. MYR.']]],
    ['mcp', 'Search issues', 'github__search_issues', 'Search issues and pull requests across GitHub.', 3, 'mcp', [['q', 'Text', 1, 'GitHub search syntax.']]],
    ['mcp', 'Create issue', 'github__create_issue', 'Open a new issue in a repository.', 0, 'mcp', [['repo', 'Text', 1, 'owner/name'], ['title', 'Text', 1, 'Issue title.'], ['body', 'Text', 0, 'Issue text.']]]
  ]
  const SRC = { builtin: ['Built in', 'Provided by Cloth'], mine: ['Web request', 'Made by you'], mcp: ['MCP', 'From the github server'] }
  const series = (n, seed) => Array.from({ length: 30 }, (_, i) => { const x = Math.sin(seed * 9.1 + i * 1.7) * 0.5 + 0.5; return n ? Math.round(x * (n / 12) + (i > 24 ? n / 30 : 0)) : 0 })

  let show = 'all', q = '', sel = -1
  const $ = (id) => document.getElementById(id)
  const visible = () => T.map((t, i) => ({ t, i })).filter(({ t }) => (show === 'all' || t[5] === show) && (!q || (t[1] + t[2] + t[3]).toLowerCase().includes(q)))

  function render() {
    const counts = { all: T.length, builtin: T.filter((t) => t[5] === 'builtin').length, mine: T.filter((t) => t[5] === 'mine').length, mcp: T.filter((t) => t[5] === 'mcp').length }
    $('tabs').innerHTML = [['all', 'All'], ['builtin', 'Built in'], ['mine', 'Made by you'], ['mcp', 'From MCP']].map(([k, l]) => `<button role="tab" aria-selected="${show === k}" class="tab ${show === k ? 'on' : ''}" data-show="${k}">${l}<small>${counts[k]}</small></button>`).join('')
    const v = visible()
    const groups = G.map(([g, label, ic]) => ({ g, label, ic, items: v.filter(({ t }) => t[0] === g) })).filter((x) => x.items.length)
    $('jump').innerHTML = groups.map((x) => `<button data-jump="${x.g}">${x.label.split(' · ')[0]}</button>`).join('')
    $('groups').innerHTML = groups.length ? groups.map((x) => `<section id="g-${x.g}"><h2>${x.label}<small>${x.items.length}</small></h2><div class="grid">${x.items.map(({ t, i }) => {
      const s = series(t[4], i).slice(-14), max = Math.max(1, ...s)
      return `<button class="tool ${sel === i ? 'sel' : ''}" data-i="${i}"><span class="body"><span class="ic">${ICON[x.ic]}</span><span style="min-width:0"><b>${t[1]}</b><span class="id mono">${t[2]}</span><p>${t[3]}</p></span></span><span class="foot">${SRC[t[5]][0]}<span class="uses">${t[4] ? `${t[4]} uses this month` : 'Not used yet'}</span>${t[4] ? `<span class="spark" aria-hidden="true">${s.map((n) => `<i style="height:${Math.max(1, (n / max) * 12)}px"></i>`).join('')}</span>` : ''}</span></button>`
    }).join('')}</div></section>`).join('') : `<div class="empty">No tool matches “${q}”. <button class="tab" data-clear>Clear the search</button></div>`
  }

  function open(i) {
    sel = i
    const t = T[i], g = G.find((x) => x[0] === t[0]), s = series(t[4], i), max = Math.max(1, ...s)
    $('dIcon').innerHTML = ICON[g[2]]
    $('dTitle').textContent = t[1]
    $('dId').textContent = t[2]
    $('dSource').textContent = SRC[t[5]][1]
    const req = t[6].filter((p) => p[2])
    $('dBody').innerHTML = `
      <p>${t[3]}</p>
      <div class="try">
        ${(req.length ? req : t[6].slice(0, 1)).map((p) => `<label>${p[0]}<input class="mono" placeholder="${p[3]}" /></label>`).join('')}
        <div class="row"><button class="run" id="run"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>Try it</button><span class="hint">${t[0] === 'workspace' ? 'Runs in the folder you pick' : 'Runs once, nothing is saved'}</span></div>
        <div class="out mono" id="out"></div>
      </div>
      <h4>Usage</h4>
      <div class="stats"><div><b>${t[4]}</b><span>uses in 30 days</span></div><div><b>${t[4] ? '2d ago' : '—'}</b><span>last used</span></div><div><b>${t[4] ? '0.4s' : '—'}</b><span>typical run</span></div></div>
      <div class="usage" aria-label="Uses per day over 30 days">${s.map((n) => `<i style="height:${(n / max) * 100}%"></i>`).join('')}</div>
      <div class="usage-cap"><span>30 days ago</span><span>today</span></div>
      <h4>Inputs</h4>
      ${t[6].length ? `<div class="inputs">${t[6].map((p) => `<div class="inp"><code>${p[0]}${p[2] ? '<span class="req" title="Required"> *</span>' : ''}</code><span class="t">${p[1]}</span><p>${p[3]}</p></div>`).join('')}</div>` : '<p class="note">Takes no inputs.</p>'}
      <h4>Used by</h4>
      <div class="chips"><span class="chip">Every agent</span>${t[0] === 'workspace' ? '<span class="chip">Nightly review</span>' : ''}</div>
      <p class="note">Each agent and automation chooses its own tools. Change it there.</p>
      <details><summary>What the AI sees</summary><pre class="mono">${JSON.stringify({ name: t[2], description: t[3], parameters: { type: 'object', properties: Object.fromEntries(t[6].map((p) => [p[0], { type: p[1] === 'Number' ? 'number' : p[1] === 'Text' ? 'string' : 'object', description: p[3] }])), required: req.map((p) => p[0]) } }, null, 2).replace(/</g, '&lt;')}</pre></details>`
    $('run').onclick = () => { const o = $('out'); o.classList.add('show'); o.textContent = t[2] === 'grep' ? 'src/renderer/src/pages/Tools.tsx:68: export function Tools() {\nsrc/renderer/src/pages/Tools.tsx:207:   const FILTERS: { value: Show; label: string }[] = [\n2 matches' : 'Done in 0.4s.' }
    $('drawer').classList.add('open'); $('drawer').setAttribute('aria-hidden', 'false'); $('scrim').classList.add('open')
    render()
    $('close').focus({ preventScroll: true })
  }
  function close() {
    const last = sel
    sel = -1
    $('drawer').classList.remove('open'); $('drawer').setAttribute('aria-hidden', 'true'); $('scrim').classList.remove('open')
    render()
    document.querySelector(`[data-i="${last}"]`)?.focus({ preventScroll: true })
  }
  function step(d) {
    const v = visible().map((x) => x.i), at = v.indexOf(sel)
    if (!v.length) return
    const n = v[(at + d + v.length) % v.length]
    open(n)
    document.querySelector(`[data-i="${n}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
  }

  document.addEventListener('click', (e) => {
    const t = e.target
    const c = t.closest('[data-i]'); if (c) return open(+c.dataset.i)
    const s = t.closest('[data-show]'); if (s) { show = s.dataset.show; return render() }
    const j = t.closest('[data-jump]'); if (j) return $('g-' + j.dataset.jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' })
    if (t.closest('[data-clear]')) { q = ''; $('q').value = ''; return render() }
  })
  $('scrim').onclick = close
  $('close').onclick = close
  $('prev').onclick = () => step(-1)
  $('next').onclick = () => step(1)
  $('q').addEventListener('input', (e) => { q = e.target.value.trim().toLowerCase(); render() })
  document.addEventListener('keydown', (e) => {
    const typing = e.target.matches('input, textarea')
    if (e.key === 'Escape' && sel >= 0) return close()
    if (e.key === '/' && !typing) { e.preventDefault(); return $('q').focus() }
    if (sel >= 0 && !typing && (e.key === 'ArrowDown' || e.key === 'j')) { e.preventDefault(); step(1) }
    if (sel >= 0 && !typing && (e.key === 'ArrowUp' || e.key === 'k')) { e.preventDefault(); step(-1) }
  })
  render()
</script>
</body>
</html>
