<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloth automations</title>
<style>
  :root {
    --bg: #0a0a0b; --panel: #111113; --elev: #18181b; --elev2: #202024; --line: #26262b; --line-strong: #34343b;
    --fg: #ececef; --muted: #a3a3ad; --dim: #85858f;
    --crimson: #dc2645; --crimson-hi: #ef3d5c; --crimson-soft: rgb(220 38 69 / 0.12); --crimson-line: rgb(220 38 69 / 0.35);
    --ok: #3fb97a; --warn: #e0a43a; --del: #f0656f; --agent: #5ec8e0; --agent-soft: rgb(94 200 224 / 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Inter, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; text-align: left; }
  :focus-visible { outline: 2px solid var(--crimson-hi); outline-offset: 2px; border-radius: 6px; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  svg { flex-shrink: 0; }

  .top { height: 34px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-weight: 600; }
  .logo { width: 18px; height: 18px; border-radius: 5px; background: var(--crimson); display: grid; place-items: center; font-size: 11px; color: #fff; }
  .app { display: grid; grid-template-columns: 56px 340px minmax(0, 1fr); height: calc(100vh - 34px); }
  .rail { border-right: 1px solid var(--line); display: grid; align-content: start; justify-items: center; gap: 6px; padding-top: 12px; }
  .rail span { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--dim); }
  .rail span.on { background: var(--crimson-soft); color: var(--crimson-hi); }

  /* List */
  .list { border-right: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; min-width: 0; }
  .lh { padding: 18px 16px 10px; display: flex; align-items: center; gap: 10px; }
  .lh h1 { margin: 0; font-size: 17px; font-weight: 600; flex: 1; }
  .newb { height: 30px; border-radius: 8px; background: var(--crimson); color: #fff; font-weight: 600; padding: 0 11px; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
  .newb:hover { background: var(--crimson-hi); }
  .next { margin: 0 12px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 10px 12px; }
  .next .k { color: var(--dim); font-size: 11.5px; }
  .next .v { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
  .next .v b { font-weight: 600; }
  .next .v span { color: var(--muted); font-size: 12px; }
  .day { display: flex; gap: 2px; margin-top: 9px; height: 18px; align-items: end; }
  .day i { flex: 1; background: var(--line); border-radius: 2px; height: 4px; position: relative; }
  .day i.slot { background: var(--crimson-line); height: 12px; }
  .day i.now { background: var(--fg); height: 18px; width: 2px; flex: 0 0 2px; }
  .day-cap { display: flex; justify-content: space-between; color: var(--dim); font-size: 10.5px; margin-top: 3px; }
  .items { overflow-y: auto; padding: 0 8px 16px; }
  .grp { color: var(--dim); font-size: 11.5px; padding: 10px 8px 4px; }
  .it { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 9px 10px; border-radius: 10px; }
  .it:hover { background: var(--panel); }
  .it.sel { background: var(--elev); }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.on { background: var(--ok); } .dot.off { background: var(--line-strong); } .dot.run { background: var(--warn); box-shadow: 0 0 0 3px rgb(224 164 58 / .18); }
  .it b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .when { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it.paused b { color: var(--muted); }
  .res { font-size: 11px; font-weight: 600; white-space: nowrap; }
  .res.ok { color: var(--ok); } .res.partial { color: var(--warn); } .res.blocked, .res.failed { color: var(--del); } .res.none { color: var(--dim); font-weight: 400; }

  /* Detail */
  .detail { overflow-y: auto; min-width: 0; }
  .dw { max-width: 760px; margin: 0 auto; padding: 22px 32px 60px; }
  .dhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .dhead input.name { flex: 1; min-width: 200px; background: none; border: 0; outline: 0; font-size: 20px; font-weight: 600; padding: 2px 0; border-bottom: 1px solid transparent; }
  .dhead input.name:hover, .dhead input.name:focus { border-bottom-color: var(--line-strong); }
  .btn { height: 32px; border-radius: 9px; border: 1px solid var(--line-strong); padding: 0 12px; display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; }
  .btn:hover { background: var(--elev2); }
  .btn.primary { background: var(--crimson); border-color: var(--crimson); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--crimson-hi); }
  .sw { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
  .sw .t { width: 32px; height: 18px; border-radius: 999px; background: var(--line-strong); position: relative; transition: background .15s; }
  .sw .t::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); transition: transform .15s; }
  .sw.on .t { background: var(--ok); }
  .sw.on .t::after { transform: translateX(14px); }
  .sub { color: var(--dim); margin: 4px 0 0; font-size: 12.5px; }

  .sec { margin-top: 26px; }
  .sec h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
  .sec h2 small { color: var(--dim); font-weight: 400; font-size: 12px; }
  textarea.prompt { width: 100%; min-height: 128px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 12px 14px; outline: 0; font-size: 13.5px; line-height: 1.6; }
  textarea.prompt:focus { border-color: var(--crimson-line); }
  .hint { color: var(--dim); font-size: 12px; margin-top: 6px; }

  .sentence { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 12px 14px; font-size: 14px; line-height: 2.1; }
  .pick { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 8px; background: var(--elev2); border: 1px solid var(--line-strong); font-size: 13px; vertical-align: middle; }
  .pick:hover { border-color: var(--crimson-line); }
  .pick svg { color: var(--dim); }
  .also { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--dim); font-size: 12.5px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 12.5px; color: var(--muted); }
  .chip.on { border-color: var(--crimson-line); background: var(--crimson-soft); color: var(--fg); }
  .chip.add { border-style: dashed; color: var(--dim); }
  .chip:hover { color: var(--fg); }
  .upcoming { color: var(--dim); font-size: 12px; margin-top: 8px; }
  .upcoming b { color: var(--muted); font-weight: 500; }

  .uses { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .use { display: grid; grid-template-columns: 26px 120px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; }
  .use + .use { border-top: 1px solid var(--line); }
  .use .ic { width: 26px; height: 26px; border-radius: 7px; background: var(--elev2); display: grid; place-items: center; color: var(--muted); }
  .use .lbl { color: var(--muted); font-size: 12.5px; }
  .use .val { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
  .tag { border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-size: 12px; }
  .tag.agent { border-color: transparent; background: var(--agent-soft); color: var(--agent); }
  .use .edit { color: var(--dim); font-size: 12px; }
  .use .edit:hover { color: var(--fg); }
  .safety { display: flex; gap: 8px; align-items: flex-start; color: var(--dim); font-size: 12px; margin-top: 8px; }

  .runs { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .run { display: grid; grid-template-columns: 14px 150px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 9px 14px; width: 100%; }
  .run + .run { border-top: 1px solid var(--line); }
  .run:hover { background: var(--panel); }
  .run .when { color: var(--muted); font-size: 12.5px; }
  .run .sum { color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run .num { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--dim); white-space: nowrap; }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--warn); animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  .more { color: var(--dim); font-size: 12px; margin-top: 8px; display: inline-block; }
  .more:hover { color: var(--fg); }

  .danger { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; color: var(--dim); font-size: 12px; }
  .danger button { color: var(--dim); font-size: 12.5px; }
  .danger button:hover { color: var(--del); }

  /* New automation */
  .compose { max-width: 640px; margin: 8vh auto 0; padding: 0 24px; }
  .compose h2 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  .compose p { color: var(--muted); margin: 0 0 16px; }
  .cbox { border: 1px solid var(--line-strong); border-radius: 16px; background: var(--panel); padding: 12px; }
  .cbox textarea { width: 100%; min-height: 92px; border: 0; outline: 0; background: none; resize: none; font-size: 14.5px; line-height: 1.6; padding: 2px 4px; }
  .cbox .row { display: flex; justify-content: flex-end; gap: 8px; }
  .ideas { display: grid; gap: 6px; margin-top: 16px; }
  .idea { border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; color: var(--muted); }
  .idea:hover { border-color: var(--line-strong); color: var(--fg); background: var(--panel); }
  .idea b { color: var(--fg); font-weight: 500; }
  .drafting { display: flex; gap: 8px; align-items: center; color: var(--muted); margin-top: 14px; }

  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .rail { display: none; }
    .list { display: none; }
    .list.show { display: grid; }
    .dw { padding: 18px 16px 48px; }
    .use { grid-template-columns: 26px minmax(0, 1fr) auto; }
    .use .lbl { display: none; }
    .run { grid-template-columns: 14px minmax(0, 1fr) auto; }
    .run .sum, .run .num:last-child { display: none; }
  }
</style>
</head>
<body>
<div class="top"><span class="logo">C</span> Cloth</div>
<div class="app">
  <nav class="rail" aria-label="App">
    <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></span>
    <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20V3H6.5A2.5 2.5 0 004 5.5z"/></svg></span>
    <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg></span>
    <span class="on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
  </nav>

  <aside class="list" aria-label="Automations">
    <div class="lh"><h1>Automations</h1><button class="newb" id="new"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>New</button></div>
    <div class="next" id="next"></div>
    <div class="items" id="items"></div>
  </aside>

  <main class="detail" id="detail"></main>
</div>

<script>
  const I = {
    clock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    cal: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    down: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>',
    play: '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',
    bot: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 13h.01M15 13h.01"/></svg>',
    tool: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>',
    book: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20V3H6.5A2.5 2.5 0 004 5.5z"/></svg>',
    folder: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>',
    term: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17l6-5-6-5M12 19h8"/></svg>',
    bell: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg>',
    shield: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-top:2px"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>',
    ok: '<svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--ok)"/><path d="M7.5 12.5l3 3 6-6" fill="none" stroke="#0a0a0b" stroke-width="2.6"/></svg>',
    partial: '<svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--warn)"/><path d="M12 7v6M12 16.5v.5" stroke="#0a0a0b" stroke-width="2.6" stroke-linecap="round"/></svg>',
    failed: '<svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--del)"/><path d="M8 12h8" stroke="#0a0a0b" stroke-width="2.6" stroke-linecap="round"/></svg>',
    eye: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'
  }
  const RESULT = { ok: 'Done', partial: 'Partly done', blocked: 'Blocked', failed: 'Failed' }
  const A = [
    { name: 'NestJS knowledge refresh', on: true, every: 'Every Monday', at: '9:00', next: 'Mon 9:00', nextIn: 'in 4 days', last: 'ok', also: [], agent: 'Researcher', tools: ['Web search', 'Fetch web page', 'Save to knowledge'], knowledge: ['NestJS docs'], folder: null, commands: 'None', report: 'Chat in Automation · notify when done',
      prompt: 'Check the NestJS release notes and docs for anything new since the last run. Add new or changed pages to the "NestJS docs" collection, and write a short summary of what changed. If nothing changed, say so in one line.',
      runs: [['ok', 'Mon 6 Oct, 9:00', 'Added 3 pages: v11.2 release notes, new CLI flags…', '2m 10s', '$0.02'], ['ok', 'Mon 29 Sep, 9:00', 'Nothing new since last week.', '41s', '$0.004'], ['partial', 'Mon 22 Sep, 9:00', 'Indexed 5 of 6 pages; one timed out.', '3m 02s', '$0.03']] },
    { name: 'Morning repo check', on: true, every: 'Every weekday', at: '8:30', next: 'Tomorrow 8:30', nextIn: 'in 14 h', last: 'partial', also: ['files'], agent: null, tools: ['Read file', 'Search files', 'Git status'], knowledge: [], folder: 'E:\\Code Projects\\Cloth-v3', commands: 'Only: npm test, npx tsc --noEmit', report: 'Chat in Automation · notify on problems',
      prompt: 'Run the type check and the tests in this folder. If anything fails, find the most likely cause from the recent commits and explain it in a few lines with file and line. Do not change any files.',
      runs: [['partial', 'Today, 8:30', '2 tests failed in permissions.test.ts; likely e540d0d.', '1m 48s', '$0.01'], ['ok', 'Yesterday, 8:30', 'Type check clean, 622 tests passed.', '1m 12s', '$0.006'], ['ok', 'Fri 10 Oct, 8:30', 'Type check clean, 614 tests passed.', '1m 05s', '$0.006']] },
    { name: 'Price watch: RTX 5080', on: true, every: 'Every hour', at: '', next: '21:00', nextIn: 'in 18 min', last: 'ok', also: ['url'], agent: null, tools: ['Fetch web page'], knowledge: [], folder: null, commands: 'None', report: 'Notify only when the price drops',
      prompt: 'Check the price of the RTX 5080 Founders Edition on the store page. Only notify me if it is below RM 4,200 or back in stock.',
      runs: [['ok', 'Today, 20:00', 'RM 4,599, out of stock. No alert.', '9s', '$0.001'], ['ok', 'Today, 19:00', 'RM 4,599, out of stock. No alert.', '8s', '$0.001']] },
    { name: 'Weekly portfolio digest', on: false, every: 'Every Friday', at: '17:00', next: '—', nextIn: 'paused', last: 'failed', also: [], agent: 'Researcher', tools: ['Web search'], knowledge: ['Portfolio'], folder: null, commands: 'None', report: 'Chat in Automation',
      prompt: 'Summarise the week for my portfolio site: new projects, commits, and anything worth writing about.',
      runs: [['failed', 'Fri 3 Oct, 17:00', 'The model provider was unreachable.', '4s', '—']] }
  ]
  let sel = 1, composing = false, drafting = false
  const $ = (id) => document.getElementById(id)

  function list() {
    const on = A.map((a, i) => [a, i]).filter(([a]) => a.on), off = A.map((a, i) => [a, i]).filter(([a]) => !a.on)
    const row = ([a, i]) => `<button class="it ${i === sel && !composing ? 'sel' : ''} ${a.on ? '' : 'paused'}" data-sel="${i}"><span class="dot ${a.running ? 'run' : a.on ? 'on' : 'off'}"></span><span style="min-width:0"><b>${a.name}</b><span class="when">${a.on ? `${a.every}${a.at ? ` at ${a.at}` : ''}${a.also.length ? ' · and on changes' : ''}` : 'Paused'}</span></span><span class="res ${a.running ? 'none' : a.last}">${a.running ? 'Running' : RESULT[a.last]}</span></button>`
    $('items').innerHTML = `<div class="grp">On · ${on.length}</div>${on.map(row).join('')}${off.length ? `<div class="grp">Paused · ${off.length}</div>${off.map(row).join('')}` : ''}`
    const marks = Array.from({ length: 24 }, (_, h) => h === 20 ? '<i class="now"></i>' : `<i class="${[8, 9].includes(h) || h > 20 ? 'slot' : ''}"></i>`).join('')
    $('next').innerHTML = `<div class="k">Next up</div><div class="v"><b>Price watch: RTX 5080</b><span>21:00 · in 18 min</span></div><div class="day" aria-hidden="true">${marks}</div><div class="day-cap"><span>00:00</span><span>today</span><span>24:00</span></div>`
  }

  function detail() {
    if (composing) {
      $('detail').innerHTML = `<div class="compose">
        <h2>New automation</h2>
        <p>Say what should happen and when. Cloth drafts the schedule and what it can use; you check it before it's turned on.</p>
        <div class="cbox"><textarea id="desc" placeholder="Every weekday at 8:30, run the tests in my Cloth folder and tell me what broke…"></textarea>
          <div class="row"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="draft">Draft it</button></div></div>
        ${drafting ? `<div class="drafting"><span class="spin"></span>Drafting the schedule, tools and access…</div>` : `<div class="ideas">
          <button class="idea" data-idea="Every Monday at 9:00, check the NestJS changelog and add anything new to my NestJS knowledge collection."><b>Keep a knowledge collection fresh</b> · every Monday, add what changed</button>
          <button class="idea" data-idea="Every hour, check this store page and notify me if the price drops below RM 4,200."><b>Watch a web page</b> · notify me only when something changes</button>
          <button class="idea" data-idea="Every weekday at 8:30, run the tests in my project folder and explain any failures. Don't change files."><b>Morning repo check</b> · run the tests and explain failures</button>
        </div>`}
      </div>`
      return
    }
    const a = A[sel]
    const last = a.runs[0]
    $('detail').innerHTML = `<div class="dw">
      <div class="dhead">
        <input class="name" value="${a.name}" aria-label="Name" />
        <button class="sw ${a.on ? 'on' : ''}" id="toggle" role="switch" aria-checked="${a.on}"><span class="t"></span>${a.on ? 'On' : 'Paused'}</button>
        <button class="btn primary" id="runnow" ${a.running ? 'disabled style="opacity:.6"' : ''}>${I.play} ${a.running ? 'Running…' : 'Run now'}</button>
      </div>
      <p class="sub">${a.on ? `Next run ${a.next} (${a.nextIn}). ` : 'Paused: it won\u2019t run until you turn it on. '}Last run: <span class="res ${last[0]}">${RESULT[last[0]]}</span>, ${last[1].toLowerCase()}.</p>

      <section class="sec"><h2>What it does <small>Written as you'd ask in a chat</small></h2>
        <textarea class="prompt" aria-label="Instructions">${a.prompt}</textarea>
        <div class="hint">It decides how to report: a chat in the Automation project, a notification, or saving to knowledge.</div>
      </section>

      <section class="sec"><h2>When it runs</h2>
        <div class="sentence">
          <button class="pick">${I.cal} ${a.every} ${I.down}</button>
          ${a.at ? ` at <button class="pick">${I.clock} ${a.at} ${I.down}</button>` : ''}
        </div>
        <div class="also">Also when
          <button class="chip ${a.also.includes('files') ? 'on' : ''}" data-also="files">${I.folder} files in its folder change</button>
          <button class="chip ${a.also.includes('url') ? 'on' : ''}" data-also="url">${I.eye} a web page changes</button>
          <button class="chip ${a.also.includes('mcp') ? 'on' : ''}" data-also="mcp">${I.tool} an MCP check changes</button>
        </div>
        ${a.on ? `<div class="upcoming">Coming up: <b>${a.next}</b>${a.every === 'Every weekday' ? ', Fri 8:30, Mon 8:30' : a.every === 'Every hour' ? ', 22:00, 23:00' : ', Mon 20 Oct 9:00'}</div>` : ''}
      </section>

      <section class="sec"><h2>What it can use</h2>
        <div class="uses">
          <div class="use"><span class="ic">${I.bot}</span><span class="lbl">Runs as</span><span class="val">${a.agent ? `<span class="tag agent">${a.agent}</span>` : '<span class="tag">Cloth</span>'}<span class="tag">GPT-6 Luna · Medium</span></span><button class="edit">Change</button></div>
          <div class="use"><span class="ic">${I.tool}</span><span class="lbl">Tools</span><span class="val">${a.tools.map((t) => `<span class="tag">${t}</span>`).join('')}</span><button class="edit">Change</button></div>
          <div class="use"><span class="ic">${I.book}</span><span class="lbl">Knowledge</span><span class="val">${a.knowledge.length ? a.knowledge.map((t) => `<span class="tag">${t}</span>`).join('') : '<span style="color:var(--dim)">None</span>'}</span><button class="edit">Change</button></div>
          <div class="use"><span class="ic">${I.folder}</span><span class="lbl">Folder</span><span class="val">${a.folder ? `<span class="tag mono" style="font-size:11.5px">${a.folder}</span>` : '<span style="color:var(--dim)">None</span>'}</span><button class="edit">Change</button></div>
          <div class="use"><span class="ic">${I.term}</span><span class="lbl">Commands</span><span class="val">${a.commands === 'None' ? '<span style="color:var(--dim)">None</span>' : `<span class="tag mono" style="font-size:11.5px">${a.commands}</span>`}</span><button class="edit">Change</button></div>
          <div class="use"><span class="ic">${I.bell}</span><span class="lbl">Reports</span><span class="val"><span style="color:var(--muted)">${a.report}</span></span><button class="edit">Change</button></div>
        </div>
        <div class="safety">${I.shield}<span>Nobody is there to approve while it runs, so risky actions (outside its folder, deleting, pushing, installing) are refused, not asked.</span></div>
      </section>

      <section class="sec"><h2>Recent runs <small>${a.runs.length} in the last 30 days · $${(a.runs.length * 0.01).toFixed(2)}</small></h2>
        <div class="runs">${a.running ? `<button class="run"><span class="spin"></span><span class="when">Now</span><span class="sum">Running the type check…</span><span class="num">0:12</span><span class="num"></span></button>` : ''}${a.runs.map((r) => `<button class="run" title="Open this run's chat">${I[r[0]] || I.failed}<span class="when">${r[1]}</span><span class="sum">${r[2]}</span><span class="num">${r[3]}</span><span class="num">${r[4]}</span></button>`).join('')}</div>
        <a class="more" href="#">Open all runs in the Automation project →</a>
      </section>

      <div class="danger"><button>Duplicate</button><span>·</span><button>Delete automation…</button></div>
    </div>`
  }
  function render() { list(); detail() }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button,a'); if (!t) return
    if (t.dataset.sel) { sel = +t.dataset.sel; composing = false }
    else if (t.id === 'new') { composing = true; drafting = false }
    else if (t.id === 'cancel') composing = false
    else if (t.dataset.idea) { $('desc').value = t.dataset.idea; return }
    else if (t.id === 'draft') { drafting = true; render(); setTimeout(() => { A.unshift({ name: 'New automation', on: false, every: 'Every weekday', at: '8:30', next: '—', nextIn: 'paused', last: 'ok', also: [], agent: null, tools: ['Read file', 'Search files'], knowledge: [], folder: 'E:\\Code Projects\\Cloth-v3', commands: 'Only: npm test', report: 'Chat in Automation', prompt: $('desc')?.value || 'Describe the job…', runs: [['ok', 'Not run yet', 'Check it, then turn it on.', '—', '—']] }); sel = 0; composing = false; drafting = false; render() }, 1200); return }
    else if (t.id === 'toggle') A[sel].on = !A[sel].on
    else if (t.id === 'runnow') { A[sel].running = true; setTimeout(() => { A[sel].running = false; A[sel].runs.unshift(['ok', 'Just now', 'Finished. Opened its chat in Automation.', '14s', '$0.002']); A[sel].last = 'ok'; render() }, 2500) }
    else if (t.dataset.also) { const a = A[sel]; const k = t.dataset.also; a.also = a.also.includes(k) ? a.also.filter((x) => x !== k) : [...a.also, k] }
    else return
    e.preventDefault()
    render()
  })
  render()
</script>
</body>
</html>
