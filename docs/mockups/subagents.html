<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloth agent runs</title>
<style>
  :root {
    --bg: #0a0a0b; --panel: #111113; --elev: #18181b; --elev2: #202024; --line: #26262b; --line-strong: #34343b;
    --fg: #ececef; --muted: #a3a3ad; --dim: #85858f;
    --crimson: #dc2645; --crimson-hi: #ef3d5c; --crimson-soft: rgb(220 38 69 / 0.12); --crimson-line: rgb(220 38 69 / 0.35);
    --ok: #3fb97a; --warn: #e0a43a; --del: #f0656f;
    --agent: #5ec8e0; --agent-soft: rgb(94 200 224 / 0.12); --agent-line: rgb(94 200 224 / 0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14.5px/1.65 system-ui, -apple-system, "Segoe UI", Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: left; }
  :focus-visible { outline: 2px solid var(--crimson-hi); outline-offset: 2px; border-radius: 6px; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  svg { flex-shrink: 0; }

  .switch { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: center; justify-content: center; padding: 10px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--dim); }
  .switch button { height: 28px; padding: 0 11px; border-radius: 8px; color: var(--muted); }
  .switch button.on { background: var(--elev2); color: var(--fg); font-weight: 600; }
  .switch .sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; }

  .col { width: min(700px, calc(100% - 32px)); margin: 28px auto 40px; }
  .user { margin: 0 0 28px auto; width: fit-content; max-width: 80%; background: var(--elev); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
  .turn { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 14px; }
  .av { width: 26px; height: 26px; border-radius: 8px; background: var(--crimson); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; margin-top: 2px; }
  .body > p { margin: 0 0 12px; }
  .sum { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; margin: 0 0 12px; }

  .tier { border-radius: 999px; background: var(--agent-soft); color: var(--agent); font-size: 10.5px; font-weight: 600; padding: 1px 7px; }
  .acc { font-size: 11px; color: var(--dim); }
  .acc.edit { color: var(--warn); }
  .name { color: var(--agent); font-weight: 600; font-size: 13px; }
  .name.plain { color: var(--fg); }
  .job { color: var(--muted); font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .num { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--dim); white-space: nowrap; }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--agent); animation: s .8s linear infinite; flex-shrink: 0; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  .st { width: 14px; height: 14px; display: grid; place-items: center; flex-shrink: 0; }
  .res { font-size: 11px; font-weight: 600; }
  .res.ok { color: var(--ok); } .res.partial { color: var(--warn); } .res.blocked { color: var(--del); }
  .car { color: var(--dim); transition: transform .18s; }
  .open .car { transform: rotate(90deg); }
  .now { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .now b { font-family: system-ui, sans-serif; font-weight: 500; color: var(--muted); font-size: 12px; }

  /* Steps (shared by all options when opened) */
  .steps { margin: 6px 0 4px 6px; padding-left: 16px; border-left: 1px solid var(--line); }
  .step { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 3px 6px; margin-left: -6px; font-size: 12.5px; color: var(--muted); }
  .step .ic { color: var(--dim); align-self: center; display: grid; }
  .step .w { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .w b { color: var(--fg); font-weight: 500; }
  .step .w span { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--dim); }
  .earlier { font-size: 12px; color: var(--dim); padding: 2px 0 4px; }
  .earlier:hover { color: var(--muted); }
  .open-tab { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--dim); margin: 4px 0 2px; }
  .open-tab:hover { color: var(--fg); }

  /* A · Line: one quiet line per agent, like the activity lines */
  .a-run { margin: 0 0 6px; }
  .a-head { display: flex; align-items: center; gap: 8px; width: 100%; border-radius: 8px; padding: 4px 8px 4px 4px; margin-left: -4px; }
  .a-head:hover { background: var(--panel); }
  .a-head .job { flex: 1; }
  .a-live { display: flex; gap: 8px; align-items: center; margin: 0 0 0 26px; }

  /* B · Card: compact card with the live step, no report */
  .b-run { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin: 0 0 8px; overflow: hidden; }
  .b-run.live { border-color: var(--agent-line); }
  .b-head { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; width: 100%; }
  .b-ic { width: 28px; height: 28px; border-radius: 8px; background: var(--agent-soft); color: var(--agent); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .b-ic.plain { background: var(--elev2); color: var(--muted); }
  .b-top { display: flex; gap: 7px; align-items: center; min-width: 0; }
  .b-sub { display: flex; gap: 8px; align-items: center; min-width: 0; margin-top: 1px; }
  .b-right { display: flex; gap: 10px; align-items: center; }
  .b-bar { height: 2px; background: var(--line); }
  .b-bar i { display: block; height: 100%; width: 40%; background: var(--agent); animation: slide 1.6s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .b-bar i { animation: none; width: 100%; opacity: .4; } }
  .b-body { border-top: 1px solid var(--line); padding: 4px 12px 8px; }

  /* C · Chips: agents as chips in one row; parallel runs sit side by side */
  .c-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px 0 8px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--panel); font-size: 12.5px; max-width: 100%; }
  .chip:hover { border-color: var(--agent-line); }
  .chip.sel { border-color: var(--agent-line); background: var(--agent-soft); }
  .chip .job { font-size: 12.5px; max-width: 220px; }
  .c-pop { border: 1px solid var(--line-strong); border-radius: 12px; background: var(--panel); padding: 10px 12px; margin: -2px 0 12px; }
  .c-pop .hd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
  .c-pop .hd .num { margin-left: auto; }

  .note { width: min(700px, calc(100% - 32px)); margin: 0 auto 80px; color: var(--dim); font-size: 12.5px; border: 1px dashed var(--line-strong); border-radius: 12px; padding: 12px 14px; }
  .note b { color: var(--muted); }
</style>
</head>
<body>
<div class="switch" role="toolbar" aria-label="Mockup controls">
  <span>Option</span>
  <button data-v="a" class="on">A · Line</button>
  <button data-v="b">B · Compact card</button>
  <button data-v="c">C · Chips</button>
  <span class="sep"></span>
  <span>State</span>
  <button data-s="live">Working</button>
  <button data-s="done" class="on">Finished</button>
</div>
<div class="col" id="root"></div>
<div class="note" id="note"></div>

<script>
  const IC = {
    check: '<svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--ok)"/><path d="M7.5 12.5l3 3 6-6" fill="none" stroke="#0a0a0b" stroke-width="2.6"/></svg>',
    warn: '<svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--warn)"/><path d="M12 7v6M12 16.5v.5" stroke="#0a0a0b" stroke-width="2.6" stroke-linecap="round"/></svg>',
    stop: '<svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--del)"/><path d="M8 12h8" stroke="#0a0a0b" stroke-width="2.6" stroke-linecap="round"/></svg>',
    car: '<svg class="car" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>',
    grep: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    read: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/></svg>',
    edit: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
    side: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>'
  }
  // [agent name or null, role, tier, job, steps, time, cost, outcome, current step, step list]
  const RUNS = [
    ['Code reviewer', 'scout', 'Heavy', 'Audit Cloth codebase', 108, '2m 41s', '$0.04', 'ok', ['grep', 'Searched', '/plain:|safeStorage.isEncryptionAvailable/ src'],
      [['grep', 'Searched', '/loadUrl\\(url/ src/main'], ['grep', 'Searched', '/webAllowPrivate/ src/main/web/web.ts'], ['read', 'Read', 'mobile/android/app/src/main/AndroidManifest.xml'], ['grep', 'Searched', '/"test"|"build"/ package.json'], ['grep', 'Searched', '/safeStorage.isEncryptionAvailable/ src']]],
    [null, 'scout', 'Light', 'Find where tools run custom JS', 14, '19s', '$0.002', 'ok', ['read', 'Read', 'src/main/tools/custom.ts'],
      [['grep', 'Searched', '/runInNewContext/ src'], ['read', 'Read', 'src/main/tools/custom.ts']]],
    ['Designer', 'worker', 'Careful', 'Tighten the Tools drawer spacing', 22, '1m 05s', '$0.01', 'partial', ['edit', 'Edited', 'src/renderer/src/pages/Tools.tsx'],
      [['read', 'Read', 'src/renderer/src/pages/Tools.tsx'], ['edit', 'Edited', 'src/renderer/src/pages/Tools.tsx']]]
  ]
  let v = 'a', state = 'done', open = new Set(), sel = 0
  const $ = (id) => document.getElementById(id)
  const live = () => state === 'live'
  const status = (r, i) => live() && i !== 1 ? '<span class="spin" aria-label="Working"></span>' : `<span class="st">${r[7] === 'ok' ? IC.check : r[7] === 'partial' ? IC.warn : IC.stop}</span>`
  const result = (r) => `<span class="res ${r[7]}">${r[7] === 'ok' ? 'Done' : r[7] === 'partial' ? 'Partly done' : 'Blocked'}</span>`
  const name = (r) => `<span class="name ${r[0] ? '' : 'plain'}">${r[0] ?? (r[1] === 'worker' ? 'Worker' : 'Scout')}</span>`
  const meta = (r) => `<span class="tier">${r[2]}</span><span class="acc ${r[1] === 'worker' ? 'edit' : ''}">${r[1] === 'worker' ? 'can edit' : 'read-only'}</span>`
  const nums = (r, i) => live() && i !== 1 ? `<span class="num">${Math.round(r[4] * 0.6)} steps · ${r[5].split(' ')[0]}</span>` : `<span class="num">${r[4]} steps · ${r[5]} · ${r[6]}</span>`
  const nowLine = (r) => `<span class="now"><b>${r[8][1]}</b> ${r[8][2]}</span>`
  const steps = (r) => `<div class="steps">${r[4] > r[9].length ? `<button class="earlier">… ${r[4] - r[9].length} earlier steps</button>` : ''}${r[9].map((s) => `<div class="step"><span class="ic">${IC[s[0]]}</span><span class="w"><b>${s[1]}</b> <span>${s[2]}</span></span><span>${IC.check.replace(/14/g, '12')}</span></div>`).join('')}<button class="open-tab">${IC.side} Open in the Agents tab</button></div>`

  function A() {
    return RUNS.map((r, i) => {
      const o = open.has(i), running = live() && i !== 1
      return `<div class="a-run ${o ? 'open' : ''}">
        <button class="a-head" data-open="${i}" aria-expanded="${o}">${IC.car}${status(r, i)}${name(r)}${meta(r)}<span class="job">${r[3]}</span>${running ? '' : result(r)}${nums(r, i)}</button>
        ${running && !o ? `<div class="a-live">${nowLine(r)}</div>` : ''}
        ${o ? steps(r) : ''}
      </div>`
    }).join('')
  }
  function B() {
    return RUNS.map((r, i) => {
      const o = open.has(i), running = live() && i !== 1
      const initial = (r[0] ?? (r[1] === 'worker' ? 'W' : 'S'))[0]
      return `<div class="b-run ${running ? 'live' : ''} ${o ? 'open' : ''}">
        <button class="b-head" data-open="${i}" aria-expanded="${o}">
          <span class="b-ic ${r[0] ? '' : 'plain'}">${initial}</span>
          <span style="min-width:0"><span class="b-top">${name(r)}${meta(r)}</span><span class="b-sub">${running ? nowLine(r) : `<span class="job">${r[3]}</span>`}</span></span>
          <span class="b-right">${running ? '' : result(r)}${nums(r, i)}${status(r, i)}${IC.car}</span>
        </button>
        ${running ? '<div class="b-bar"><i></i></div>' : ''}
        ${o ? `<div class="b-body">${steps(r)}</div>` : ''}
      </div>`
    }).join('')
  }
  function C() {
    const r = RUNS[sel]
    return `<div class="c-row">${RUNS.map((x, i) => `<button class="chip ${i === sel ? 'sel' : ''}" data-sel="${i}">${status(x, i)}${name(x)}<span class="job">${x[3]}</span></button>`).join('')}</div>
      <div class="c-pop"><div class="hd">${name(r)}${meta(r)}<span class="job">${r[3]}</span>${live() && sel !== 1 ? '' : result(r)}${nums(r, sel)}</div>${live() && sel !== 1 ? `<div style="margin-top:6px">${nowLine(r)}</div>` : ''}${steps(r)}</div>`
  }

  function render() {
    document.querySelectorAll('[data-v]').forEach((b) => b.classList.toggle('on', b.dataset.v === v))
    document.querySelectorAll('[data-s]').forEach((b) => b.classList.toggle('on', b.dataset.s === state))
    $('root').innerHTML = `
      <div class="user">Review the codebase for security issues and tidy the Tools drawer.</div>
      <div class="turn"><span class="av">C</span><div class="body">
        <p>I'll split this: a reviewer audits the code, a scout finds where custom tools run JavaScript, and the designer tightens the drawer.</p>
        ${v === 'a' ? A() : v === 'b' ? B() : C()}
        ${live() ? '' : '<p style="margin-top:14px">The reviewer found one high-severity issue: custom JavaScript tools can reach host functions through <code class="mono" style="font-size:12.5px">runInNewContext</code>. Details below.</p>'}
      </div></div>`
    $('note').innerHTML = {
      a: '<b>A · Line.</b> Each agent run is one quiet line, the same style as the folded activity lines: status, who (agent, tier, access), the job, result and numbers. While working, the current step shows on a second dim line. Opening it shows the latest steps and a link to the Agents tab; no report (the reply already summarises it). Lightest option; parallel runs stack as lines.',
      b: '<b>B · Compact card.</b> A small card per run with a letter badge, who/tier/access on top and the job (or the live step) under it; result, steps, time and cost on the right. A thin moving bar marks a running agent. Opens to the latest steps. Keeps runs visibly separate from the rest of the reply without the tall step list and report of today.',
      c: '<b>C · Chips.</b> All agents of a turn sit side by side as chips (status, name, job). Clicking one shows its details and steps in one panel under the row. Best when several agents run in parallel; one panel at a time keeps the reply short.'
    }[v]
  }
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button'); if (!t) return
    if (t.dataset.v) { v = t.dataset.v; open.clear() }
    else if (t.dataset.s) state = t.dataset.s
    else if (t.dataset.open) { const i = +t.dataset.open; open.has(i) ? open.delete(i) : open.add(i) }
    else if (t.dataset.sel) sel = +t.dataset.sel
    else return
    render()
  })
  render()
</script>
</body>
</html>
