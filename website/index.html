<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloth</title>
<meta name="description" content="Cloth, an open-source desktop app for working with AI models on your own machine. Coming soon.">
<meta property="og:title" content="Cloth">
<meta property="og:description" content="Coming soon.">
<meta property="og:image" content="https://skyzap.github.io/Cloth-V3/media/chat.jpg">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&display=swap">
<style>
html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
canvas.over { cursor: grab; }
canvas.holding { cursor: grabbing; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene" aria-label="A grey glasses cloth printed with the Cloth logo. Drag it to move it around."></canvas>
<script type="module">
import * as THREE from 'three/webgpu'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

/* ---------------------------------------------------------------- renderer, camera, light */
const canvas = document.getElementById('scene')
// WebGPU where the browser has it; three.js falls back to WebGL 2 by itself elsewhere.
const renderer = new THREE.WebGPURenderer({ canvas, antialias: true, alpha: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.setSize(innerWidth, innerHeight, false)
renderer.toneMapping = THREE.NeutralToneMapping
renderer.toneMappingExposure = 1.0
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
await renderer.init()
// The page itself is the white table: the canvas stays see-through, so tone mapping never greys it.
renderer.setClearColor(0xffffff, 0)

const scene = new THREE.Scene()

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 50)
const fit = () => {
  camera.aspect = innerWidth / innerHeight
  // Keep the cloth's area in view on narrow screens too.
  const d = camera.aspect < 1 ? 5.2 / Math.max(0.55, camera.aspect) : 5.2
  camera.position.set(0, d * 0.78, d * 0.62)
  camera.lookAt(0, 0, 0.05)
  camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight, false)
}
fit()
addEventListener('resize', fit)

try {
  const pmrem = new THREE.PMREMGenerator(renderer)
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
  scene.environmentIntensity = 0.55
} catch { /* lights alone still read well */ }

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d9de, 0.75))
const sun = new THREE.DirectionalLight(0xffffff, 3.2)
sun.position.set(2.2, 6, 2.8)
sun.castShadow = true
sun.shadow.mapSize.set(2048, 2048)
sun.shadow.camera.left = -3; sun.shadow.camera.right = 3; sun.shadow.camera.top = 3; sun.shadow.camera.bottom = -3
sun.shadow.camera.near = 1; sun.shadow.camera.far = 14
sun.shadow.bias = -0.0004
sun.shadow.normalBias = 0.012
sun.shadow.radius = 6
scene.add(sun)
const fill = new THREE.DirectionalLight(0xf3f4ff, 0.5)
fill.position.set(-3, 2.5, -1)
scene.add(fill)

// The table: pure white, showing only the cloth's shadow.
const floorMat = new THREE.ShadowNodeMaterial()
floorMat.opacity = 0.2
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), floorMat)
floor.rotation.x = -Math.PI / 2
floor.receiveShadow = true
scene.add(floor)

/* ---------------------------------------------------------------- textures */
await document.fonts.load('600 120px "Bricolage Grotesque"').catch(() => {})
const SIZE = 1024
const BASE = '#8c8e93'

/** Microfibre: a grey ground with fine fibre noise and an overlocked edge. */
function fabric(ctx) {
  ctx.fillStyle = BASE
  ctx.fillRect(0, 0, SIZE, SIZE)
  const img = ctx.getImageData(0, 0, SIZE, SIZE)
  const d = img.data
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 10
    d[i] += n; d[i + 1] += n; d[i + 2] += n
  }
  ctx.putImageData(img, 0, 0)
  // Overlocked edge: a denser band, then a row of stitches inside it.
  ctx.strokeStyle = 'rgba(70, 72, 78, 0.55)'
  ctx.lineWidth = 22
  ctx.strokeRect(11, 11, SIZE - 22, SIZE - 22)
  ctx.save()
  ctx.strokeStyle = 'rgba(52, 54, 60, 0.7)'
  ctx.lineWidth = 2.5
  ctx.setLineDash([7, 6])
  ctx.strokeRect(32, 32, SIZE - 64, SIZE - 64)
  ctx.restore()
}

function frontTexture() {
  const c = document.createElement('canvas'); c.width = c.height = SIZE
  const ctx = c.getContext('2d')
  fabric(ctx)
  // The Cloth mark, printed: the crimson C with its stitched bar, and the name beside it.
  const cx = 512, cy = 512, s = 0.3
  ctx.save()
  ctx.translate(cx - 200, cy)
  ctx.scale(s, s)
  ctx.translate(-512, -512)
  const g = ctx.createLinearGradient(260, 280, 760, 760)
  g.addColorStop(0, '#e23a58'); g.addColorStop(1, '#a51a33')
  ctx.strokeStyle = g
  ctx.lineWidth = 92
  ctx.lineCap = 'round'
  ctx.beginPath()
  // Same arc as the logo: centre (512, 512), radius 230, opening to the right.
  ctx.arc(512, 512, 230, -0.785, 0.785, true)
  ctx.stroke()
  ctx.strokeStyle = 'rgba(244, 244, 246, 0.8)'
  ctx.lineWidth = 40
  ctx.setLineDash([40, 64])
  ctx.beginPath(); ctx.moveTo(410, 512); ctx.lineTo(610, 512); ctx.stroke()
  ctx.restore()
  ctx.fillStyle = 'rgba(246, 246, 248, 0.9)'
  ctx.font = '600 120px "Bricolage Grotesque", "Segoe UI", sans-serif'
  ctx.textBaseline = 'middle'
  ctx.fillText('Cloth', cx - 92, cy + 4)
  return finish(c)
}

function backTexture() {
  const c = document.createElement('canvas'); c.width = c.height = SIZE
  const ctx = c.getContext('2d')
  fabric(ctx)
  // Seen from behind, the texture is mirrored: draw it mirrored so the words read the right way round.
  ctx.save()
  ctx.translate(SIZE, 0); ctx.scale(-1, 1)
  ctx.fillStyle = 'rgba(246, 246, 248, 0.88)'
  ctx.font = '600 92px "Bricolage Grotesque", "Segoe UI", sans-serif'
  if ('letterSpacing' in ctx) ctx.letterSpacing = '10px'
  ctx.textAlign = 'center'
  ctx.textBaseline = 'middle'
  ctx.fillText('coming soon', 512, 512)
  ctx.restore()
  return finish(c)
}

function finish(canvas) {
  const t = new THREE.CanvasTexture(canvas)
  t.colorSpace = THREE.SRGBColorSpace
  t.anisotropy = 8
  return t
}

/** The weave, as a tiling normal map: warp and weft threads crossing over and under. */
function weaveNormals() {
  const n = 128, c = document.createElement('canvas'); c.width = c.height = n
  const ctx = c.getContext('2d'), img = ctx.createImageData(n, n)
  const h = (x, y) => {
    const u = (x / n) * Math.PI * 16, v = (y / n) * Math.PI * 16
    const over = Math.sign(Math.sin(u / 2) * Math.sin(v / 2))
    return Math.abs(Math.sin(u)) * (over > 0 ? 1 : 0.4) + Math.abs(Math.sin(v)) * (over > 0 ? 0.4 : 1) + (Math.random() - 0.5) * 0.25
  }
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const dx = h((x + 1) % n, y) - h((x - 1 + n) % n, y)
    const dy = h(x, (y + 1) % n) - h(x, (y - 1 + n) % n)
    const v = new THREE.Vector3(-dx, -dy, 2.2).normalize()
    const i = (y * n + x) * 4
    img.data[i] = (v.x * 0.5 + 0.5) * 255; img.data[i + 1] = (v.y * 0.5 + 0.5) * 255; img.data[i + 2] = (v.z * 0.5 + 0.5) * 255; img.data[i + 3] = 255
  }
  ctx.putImageData(img, 0, 0)
  const t = new THREE.CanvasTexture(c)
  t.wrapS = t.wrapT = THREE.RepeatWrapping
  t.repeat.set(36, 36)
  t.anisotropy = 8
  return t
}

/* ---------------------------------------------------------------- the cloth: particles and constraints */
const N = 44                       // particles per side
const W = 1.7                      // side length
const REST = W / (N - 1)
const COUNT = N * N
const pos = new Float32Array(COUNT * 3)
const prev = new Float32Array(COUNT * 3)
const invMass = new Float32Array(COUNT).fill(1)

// Dropped from above, steeply and drifting a little, so it lands rumpled the way a dropped cloth does.
{
  const tilt = 1.05, turn = 0.6, dt = 1 / 240
  const drift = new THREE.Vector3(0.5, 0, -0.35)
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const i = r * N + c
    const x = (c / (N - 1) - 0.5) * W, z = (r / (N - 1) - 0.5) * W
    // Tilt about x, then turn about y; a slight ripple across it.
    const y0 = -z * Math.sin(tilt) + Math.sin(c * 0.35) * 0.03, z0 = z * Math.cos(tilt)
    const xr = x * Math.cos(turn) - z0 * Math.sin(turn), zr = x * Math.sin(turn) + z0 * Math.cos(turn)
    pos[i * 3] = xr - 0.25; pos[i * 3 + 1] = 1.25 + y0; pos[i * 3 + 2] = zr + 0.1
    prev[i * 3] = pos[i * 3] - drift.x * dt; prev[i * 3 + 1] = pos[i * 3 + 1]; prev[i * 3 + 2] = pos[i * 3 + 2] - drift.z * dt
  }
}

// Constraints: stretch (neighbours), shear (diagonals) and a soft bend (two apart).
const ci = [], cj = [], cr = [], ck = []
const link = (a, b, k) => {
  ci.push(a); cj.push(b); ck.push(k)
  const dx = (a % N) - (b % N), dz = Math.floor(a / N) - Math.floor(b / N)
  cr.push(Math.hypot(dx, dz) * REST)
}
for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
  const i = r * N + c
  if (c + 1 < N) link(i, i + 1, 1)
  if (r + 1 < N) link(i, i + N, 1)
  if (c + 1 < N && r + 1 < N) { link(i, i + N + 1, 0.85); link(i + 1, i + N, 0.85) }
  if (c + 2 < N) link(i, i + 2, 0.07)
  if (r + 2 < N) link(i, i + 2 * N, 0.07)
}
const CI = Int32Array.from(ci), CJ = Int32Array.from(cj), CR = Float32Array.from(cr), CK = Float32Array.from(ck)

const GRAVITY = -11
const SUBSTEPS = 4
const ITER = 7
const THICK = 0.006                 // how far the cloth sits above the table
const SELF = REST * 0.62            // the closest two layers may come
const grab = { index: -1, target: new THREE.Vector3() }

// Self-collision: a spatial hash, so folded layers rest on each other instead of passing through.
const HASH = 8192, cellStart = new Int32Array(HASH + 1), cellItems = new Int32Array(COUNT), cellOf = new Int32Array(COUNT)
const hash = (x, y, z) => (Math.imul(x, 92837111) ^ Math.imul(y, 689287499) ^ Math.imul(z, 283923481)) & (HASH - 1)
function selfCollide() {
  const inv = 1 / SELF
  cellStart.fill(0)
  for (let i = 0; i < COUNT; i++) {
    const h = hash(Math.floor(pos[i * 3] * inv), Math.floor(pos[i * 3 + 1] * inv), Math.floor(pos[i * 3 + 2] * inv))
    cellOf[i] = h; cellStart[h]++
  }
  for (let h = 0, sum = 0; h <= HASH; h++) { const c = h < HASH ? cellStart[h] : 0; cellStart[h] = sum; sum += c }
  const fillAt = cellStart.slice()
  for (let i = 0; i < COUNT; i++) cellItems[fillAt[cellOf[i]]++] = i
  const min2 = SELF * SELF
  for (let i = 0; i < COUNT; i++) {
    const ix = Math.floor(pos[i * 3] * inv), iy = Math.floor(pos[i * 3 + 1] * inv), iz = Math.floor(pos[i * 3 + 2] * inv)
    const ri = (i / N) | 0, cii = i % N
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
      const h = hash(ix + dx, iy + dy, iz + dz)
      for (let k = cellStart[h], end = cellStart[h + 1]; k < end; k++) {
        const j = cellItems[k]
        if (j <= i) continue
        const rj = (j / N) | 0, cjj = j % N
        if (Math.abs(ri - rj) <= 2 && Math.abs(cii - cjj) <= 2) continue // neighbours in the weave
        const ax = pos[j * 3] - pos[i * 3], ay = pos[j * 3 + 1] - pos[i * 3 + 1], az = pos[j * 3 + 2] - pos[i * 3 + 2]
        const d2 = ax * ax + ay * ay + az * az
        if (d2 >= min2 || d2 === 0) continue
        const wi = invMass[i], wj = invMass[j], w = wi + wj
        if (!w) continue
        const d = Math.sqrt(d2), push = (SELF - d) / (d * w)
        pos[i * 3] -= ax * push * wi; pos[i * 3 + 1] -= ay * push * wi; pos[i * 3 + 2] -= az * push * wi
        pos[j * 3] += ax * push * wj; pos[j * 3 + 1] += ay * push * wj; pos[j * 3 + 2] += az * push * wj
      }
    }
  }
}

function step(dt) {
  const g = GRAVITY * dt * dt
  for (let i = 0; i < COUNT; i++) {
    if (!invMass[i]) continue
    const k = i * 3
    // Verlet with a little air drag.
    const vx = (pos[k] - prev[k]) * 0.992, vy = (pos[k + 1] - prev[k + 1]) * 0.992, vz = (pos[k + 2] - prev[k + 2]) * 0.992
    prev[k] = pos[k]; prev[k + 1] = pos[k + 1]; prev[k + 2] = pos[k + 2]
    pos[k] += vx; pos[k + 1] += vy + g; pos[k + 2] += vz
  }
  if (grab.index >= 0) {
    // The held point follows the hand closely but not rigidly, as fabric does between fingers.
    const k = grab.index * 3
    pos[k] += (grab.target.x - pos[k]) * 0.55
    pos[k + 1] += (grab.target.y - pos[k + 1]) * 0.55
    pos[k + 2] += (grab.target.z - pos[k + 2]) * 0.55
  }
  for (let it = 0; it < ITER; it++) {
    for (let c = 0; c < CI.length; c++) {
      const a = CI[c] * 3, b = CJ[c] * 3
      const wa = invMass[CI[c]], wb = invMass[CJ[c]], w = wa + wb
      if (!w) continue
      const dx = pos[b] - pos[a], dy = pos[b + 1] - pos[a + 1], dz = pos[b + 2] - pos[a + 2]
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-9
      const diff = ((d - CR[c]) / (d * w)) * CK[c]
      pos[a] += dx * diff * wa; pos[a + 1] += dy * diff * wa; pos[a + 2] += dz * diff * wa
      pos[b] -= dx * diff * wb; pos[b + 1] -= dy * diff * wb; pos[b + 2] -= dz * diff * wb
    }
  }
  selfCollide()
  // The table: no falling through, and friction so the cloth doesn't skate.
  for (let i = 0; i < COUNT; i++) {
    const k = i * 3
    if (pos[k + 1] < THICK) {
      pos[k + 1] = THICK
      prev[k] = pos[k] - (pos[k] - prev[k]) * 0.35
      prev[k + 2] = pos[k + 2] - (pos[k + 2] - prev[k + 2]) * 0.35
      if (prev[k + 1] < THICK) prev[k + 1] = THICK
    }
    // Stay within reach of the camera.
    const lim = 2.4
    if (pos[k] > lim) pos[k] = lim; else if (pos[k] < -lim) pos[k] = -lim
    if (pos[k + 2] > lim) pos[k + 2] = lim; else if (pos[k + 2] < -lim) pos[k + 2] = -lim
  }
}

/* ---------------------------------------------------------------- the mesh */
const geometry = new THREE.PlaneGeometry(W, W, N - 1, N - 1)
geometry.attributes.position.setUsage(THREE.DynamicDrawUsage)
const posAttr = geometry.attributes.position
const sync = () => {
  posAttr.array.set(pos)
  posAttr.needsUpdate = true
  geometry.computeVertexNormals()
  geometry.computeBoundingSphere()
}
sync()

const weave = weaveNormals()
const material = (map, side) => {
  const m = new THREE.MeshPhysicalNodeMaterial()
  m.map = map
  m.normalMap = weave
  m.normalScale = new THREE.Vector2(0.45, 0.45)
  m.roughness = 0.88
  m.metalness = 0
  m.sheen = 1
  m.sheenRoughness = 0.42
  m.sheenColor = new THREE.Color(0xc9cbd1)
  m.side = side
  return m
}
const front = new THREE.Mesh(geometry, material(frontTexture(), THREE.FrontSide))
const back = new THREE.Mesh(geometry, material(backTexture(), THREE.BackSide))
front.castShadow = true
front.receiveShadow = true
back.receiveShadow = true
scene.add(front, back)

/* ---------------------------------------------------------------- the hand */
const ray = new THREE.Raycaster()
const ndc = new THREE.Vector2()
const plane = new THREE.Plane()
const camDir = new THREE.Vector3()
let pointer = null

const aim = (e) => {
  const r = canvas.getBoundingClientRect()
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1)
  ray.setFromCamera(ndc, camera)
}
const nearestVertex = (hit) => {
  const f = hit.face, p = hit.point
  let best = f.a, bd = Infinity
  for (const v of [f.a, f.b, f.c]) {
    const d = (pos[v * 3] - p.x) ** 2 + (pos[v * 3 + 1] - p.y) ** 2 + (pos[v * 3 + 2] - p.z) ** 2
    if (d < bd) { bd = d; best = v }
  }
  return best
}
canvas.addEventListener('pointerdown', (e) => {
  aim(e)
  const hit = ray.intersectObjects([front, back], false)[0]
  if (!hit) return
  grab.index = nearestVertex(hit)
  camera.getWorldDirection(camDir)
  plane.setFromNormalAndCoplanarPoint(camDir, hit.point)
  // Picking it up lifts it a little off the table.
  grab.target.copy(hit.point)
  grab.target.y += 0.12
  try { canvas.setPointerCapture(e.pointerId) } catch { /* the pointer already left */ }
  canvas.classList.add('holding')
})
canvas.addEventListener('pointermove', (e) => {
  pointer = e
  if (grab.index < 0) return
  aim(e)
  if (ray.ray.intersectPlane(plane, grab.target)) grab.target.y = Math.max(THICK + 0.02, grab.target.y + 0.12)
})
const release = () => {
  grab.index = -1
  canvas.classList.remove('holding')
}
canvas.addEventListener('pointerup', release)
canvas.addEventListener('pointercancel', release)

/* ---------------------------------------------------------------- loop */
const clock = new THREE.Clock()
let acc = 0
const FIXED = 1 / 60
renderer.setAnimationLoop(() => {
  acc = Math.min(acc + clock.getDelta(), 0.1)
  while (acc >= FIXED) {
    for (let s = 0; s < SUBSTEPS; s++) step(FIXED / SUBSTEPS)
    acc -= FIXED
  }
  sync()
  if (pointer && grab.index < 0) {
    aim(pointer)
    canvas.classList.toggle('over', ray.intersectObjects([front, back], false).length > 0)
  }
  renderer.render(scene, camera)
})
</script>
</body>
</html>
